{% extends "base.html" %}
{% block main %}
<body class="bg-gradient-to-br from-orange-100 via-orange-50 to-white font-sans min-h-screen py-12">
    <div class="max-w-5xl mx-auto backdrop-blur-lg bg-white/20 p-8 rounded-3xl shadow-2xl border border-white/30 hover:shadow-orange-200/20 transition-all duration-300">
        
        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-4xl font-light text-orange-600 tracking-wide">ตรวจจับท่านั่ง</h1>
            <p class="text-orange-500/80 text-lg mt-2">เลือกโหมดการตรวจจับที่คุณต้องการ</p>
        </div>

        <!-- Cards Container -->
        <div class="flex justify-center gap-10">
            <!-- Card: Photo Detection -->
            <div class="card w-96 backdrop-blur-md bg-white/40 rounded-3xl border border-white/50 shadow-xl hover:shadow-orange-200/30 transition-all duration-300 overflow-hidden group flex flex-col">
                <figure class="px-8 pt-8">
                    <img src="http://127.0.0.1:8000/static/images/camera.png" alt="Photo Detection" 
                         class="rounded-xl w-full h-64 object-contain mx-auto group-hover:scale-105 transition-transform duration-300">
                </figure>
                <div class="card-body p-6 text-center flex flex-col flex-grow">
                    <h2 class="text-xl font-semibold text-orange-600">Photo Detection</h2>
                    <p class="text-orange-600/80 mt-2 min-h-16 flex items-center justify-center">
                        ตรวจจับท่าทางการนั่งจากภาพถ่าย เพื่อวิเคราะห์ท่านั่งของคุณ
                    </p>
                    <div class="mt-auto"> 
                        <a href="{% url 'camera:Image-upload' %}" 
                           class="px-6 py-3 bg-orange-500/90 text-white rounded-xl shadow-lg transition-all hover:scale-105 flex items-center justify-center gap-2">
                            <span>เริ่มต้นใช้งาน</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Card: Real-time Detection -->
            <div class="card w-96 backdrop-blur-md bg-white/40 rounded-3xl border border-white/50 shadow-xl hover:shadow-orange-200/30 transition-all duration-300 overflow-hidden group flex flex-col">
                <figure class="px-8 pt-8">
                    <img src="http://127.0.0.1:8000/static/images/sitting.png" alt="Real-time Detection" 
                         class="rounded-xl w-full h-64 object-contain mx-auto group-hover:scale-105 transition-transform duration-300">
                </figure>
                <div class="card-body p-6 text-center flex flex-col flex-grow">
                    <h2 class="text-xl font-semibold text-orange-600">Real-time Detection</h2>
                    <p class="text-orange-600/80 mt-2 min-h-16 flex items-center justify-center">
                        ตรวจจับท่าทางการนั่งแบบเรียลไทม์ เพื่อติดตามท่านั่งของคุณ
                    </p>
                    <div class="mt-auto">
                        <a href="{% url 'camera:camera_detection' %}" 
                           class="px-6 py-3 bg-orange-500/90 text-white rounded-xl shadow-lg transition-all hover:scale-105 flex items-center justify-center gap-2">
                            <span>เริ่มต้นใช้งาน</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
{% endblock %}
